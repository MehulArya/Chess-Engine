<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260">
  <rect width="760" height="260" fill="#1e1e2e" rx="10"/>
  <text x="20" y="30" fill="#cba6f7" font-size="16" font-weight="bold">32-bit Move Encoding</text>
  <rect x="20" y="50" width="140" height="44" fill="#89b4fa" rx="4"/>
  <text x="90" y="76" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">To (0-5)</text>
  <rect x="160" y="50" width="140" height="44" fill="#89dceb" rx="4"/>
  <text x="230" y="76" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">From (6-11)</text>
  <rect x="300" y="50" width="110" height="44" fill="#a6e3a1" rx="4"/>
  <text x="355" y="76" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Promo (12-15)</text>
  <rect x="410" y="50" width="100" height="44" fill="#fab387" rx="4"/>
  <text x="460" y="76" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Moved (16-19)</text>
  <rect x="510" y="50" width="100" height="44" fill="#f38ba8" rx="4"/>
  <text x="560" y="76" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Capt (20-23)</text>
  <rect x="610" y="50" width="110" height="44" fill="#cba6f7" rx="4"/>
  <text x="665" y="76" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Flag (24-27)</text>
  <text x="90" y="110" fill="#89b4fa" font-size="10" text-anchor="middle">0-5</text>
  <text x="230" y="110" fill="#89dceb" font-size="10" text-anchor="middle">6-11</text>
  <text x="355" y="110" fill="#a6e3a1" font-size="10" text-anchor="middle">12-15</text>
  <text x="460" y="110" fill="#fab387" font-size="10" text-anchor="middle">16-19</text>
  <text x="560" y="110" fill="#f38ba8" font-size="10" text-anchor="middle">20-23</text>
  <text x="665" y="110" fill="#cba6f7" font-size="10" text-anchor="middle">24-27</text>
  <text x="20" y="145" fill="#cdd6f4" font-size="12">Example: Move e2e4 (white pawn e2 to e4)</text>
  <rect x="20" y="155" width="140" height="32" fill="#89b4fa" rx="4"/>
  <text x="90" y="175" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">To: 28 (e4)</text>
  <rect x="160" y="155" width="140" height="32" fill="#89dceb" rx="4"/>
  <text x="230" y="175" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">From: 12 (e2)</text>
  <rect x="300" y="155" width="110" height="32" fill="#a6e3a1" rx="4"/>
  <text x="355" y="175" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Promo: None</text>
  <rect x="410" y="155" width="100" height="32" fill="#fab387" rx="4"/>
  <text x="460" y="175" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Moved: WP</text>
  <rect x="510" y="155" width="100" height="32" fill="#f38ba8" rx="4"/>
  <text x="560" y="175" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Capt: Empty</text>
  <rect x="610" y="155" width="110" height="32" fill="#cba6f7" rx="4"/>
  <text x="665" y="175" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Flag: Quiet</text>
  <text x="20" y="225" fill="#585b70" font-size="11">Move Flags: Quiet=0 | Capture=1 | DblPawn=2 | KCastle=3 | QCastle=4 | EnPassant=5 | Promo=6 | PromoCap=7</text>
</svg>