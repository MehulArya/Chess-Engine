<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="sans-serif">
  <rect width="720" height="400" fill="#1e1e2e" rx="12"/>
  <text x="20" y="35" fill="#cba6f7" font-size="18" font-weight="bold">Engine Architecture</text>

  <!-- UCI Layer -->
  <rect x="30" y="60" width="660" height="50" fill="#313244" rx="6"/>
  <rect x="30" y="60" width="660" height="50" fill="#cba6f7" rx="6" opacity="0.15"/>
  <text x="360" y="90" fill="#cba6f7" font-size="15" font-weight="bold" text-anchor="middle">UCI Protocol Layer (uci_like.h/cpp)</text>

  <!-- Arrows down -->
  <line x1="200" y1="110" x2="200" y2="145" stroke="#585b70" stroke-width="2"/>
  <line x1="520" y1="110" x2="520" y2="145" stroke="#585b70" stroke-width="2"/>
  <text x="200" y="140" fill="#585b70" font-size="10" text-anchor="middle">position</text>
  <text x="520" y="140" fill="#585b70" font-size="10" text-anchor="middle">go</text>

  <!-- Search + Eval side by side -->
  <rect x="350" y="150" width="340" height="100" fill="#89b4fa" rx="6" opacity="0.15"/>
  <rect x="350" y="150" width="340" height="45" fill="#89b4fa" rx="6"/>
  <text x="520" y="177" fill="#1e1e2e" font-size="14" font-weight="bold" text-anchor="middle">Search (search.h/cpp)</text>
  <text x="520" y="195" fill="#1e1e2e" font-size="11" text-anchor="middle">Alpha-Beta with Negamax</text>
  
  <rect x="350" y="205" width="340" height="45" fill="#fab387" rx="6"/>
  <text x="520" y="232" fill="#1e1e2e" font-size="14" font-weight="bold" text-anchor="middle">Evaluation (eval.h/cpp)</text>
  <text x="520" y="250" fill="#1e1e2e" font-size="11" text-anchor="middle">Material + Piece-Square Tables</text>

  <!-- Board layer -->
  <rect x="30" y="150" width="300" height="100" fill="#a6e3a1" rx="6" opacity="0.15"/>
  <rect x="30" y="150" width="300" height="45" fill="#a6e3a1" rx="6"/>
  <text x="180" y="177" fill="#1e1e2e" font-size="14" font-weight="bold" text-anchor="middle">Board (board.h/cpp)</text>
  <text x="180" y="195" fill="#1e1e2e" font-size="11" text-anchor="middle">FEN, makeMove, unmakeMove, isInCheck</text>

  <rect x="30" y="205" width="300" height="45" fill="#89dceb" rx="6"/>
  <text x="180" y="232" fill="#1e1e2e" font-size="14" font-weight="bold" text-anchor="middle">Move Generation (movegen.h/cpp)</text>
  <text x="180" y="250" fill="#1e1e2e" font-size="11" text-anchor="middle">Pseudo-legal + Legal filtering</text>

  <!-- Arrows from board to search -->
  <line x1="330" y1="200" x2="350" y2="200" stroke="#585b70" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Support layer -->
  <rect x="30" y="280" width="660" height="50" fill="#313244" rx="6"/>
  <rect x="30" y="280" width="660" height="50" fill="#f38ba8" rx="6" opacity="0.1"/>
  <text x="360" y="305" fill="#f38ba8" font-size="14" font-weight="bold" text-anchor="middle">Support Modules</text>
  <text x="360" y="322" fill="#cdd6f4" font-size="12" text-anchor="middle">types.h &nbsp;|&nbsp; move.h/cpp &nbsp;|&nbsp; attacks.h/cpp &nbsp;|&nbsp; zobrist.h/cpp &nbsp;|&nbsp; tt.cpp</text>

  <!-- Arrows up from support -->
  <line x1="130" y1="280" x2="130" y2="255" stroke="#585b70" stroke-width="1.5"/>
  <line x1="360" y1="280" x2="360" y2="255" stroke="#585b70" stroke-width="1.5"/>
  <line x1="590" y1="280" x2="590" y2="255" stroke="#585b70" stroke-width="1.5"/>

  <!-- Data flow description -->
  <text x="30" y="370" fill="#585b70" font-size="11">Data flow: GUI → UCI → Board/MoveGen → Search → Eval → Score → Best Move</text>
</svg>