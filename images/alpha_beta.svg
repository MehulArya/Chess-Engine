<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480">
  <rect width="720" height="480" fill="#1e1e2e" rx="10"/>
  <text x="20" y="30" fill="#cba6f7" font-size="16" font-weight="bold">Alpha-Beta Pruning Visualization</text>

  <circle cx="360" cy="70" r="20" fill="#89b4fa" stroke="#b4befe" stroke-width="2"/>
  <text x="360" y="75" fill="#1e1e2e" font-size="12" text-anchor="middle" font-weight="bold">Root</text>

  <line x1="120" y1="160" x2="320" y2="95" stroke="#585b70" stroke-width="2"/>
  <line x1="360" y1="160" x2="360" y2="95" stroke="#585b70" stroke-width="2"/>
  <line x1="600" y1="160" x2="400" y2="95" stroke="#585b70" stroke-width="2"/>

  <circle cx="120" cy="180" r="18" fill="#89dceb" stroke="#b4befe" stroke-width="2"/>
  <text x="120" y="185" fill="#1e1e2e" font-size="11" text-anchor="middle" font-weight="bold">ab</text>

  <circle cx="360" cy="180" r="18" fill="#89dceb" stroke="#b4befe" stroke-width="2"/>
  <text x="360" y="185" fill="#1e1e2e" font-size="11" text-anchor="middle" font-weight="bold">cd</text>

  <circle cx="600" cy="180" r="18" fill="#f38ba8" stroke="#f5a0b8" stroke-width="2"/>
  <text x="600" y="185" fill="#ffffff" font-size="11" text-anchor="middle" font-weight="bold">ef</text>

  <line x1="50" y1="265" x2="102" y2="203" stroke="#585b70" stroke-width="2"/>
  <line x1="190" y1="265" x2="138" y2="203" stroke="#585b70" stroke-width="2"/>
  <line x1="290" y1="265" x2="342" y2="203" stroke="#585b70" stroke-width="2"/>
  <line x1="430" y1="265" x2="378" y2="203" stroke="#585b70" stroke-width="2"/>

  <circle cx="50" cy="280" r="16" fill="#a6e3a1" stroke="#b4befe" stroke-width="1.5"/>
  <text x="50" y="284" fill="#1e1e2e" font-size="10" text-anchor="middle">+3</text>

  <circle cx="190" cy="280" r="16" fill="#a6e3a1" stroke="#b4befe" stroke-width="1.5"/>
  <text x="190" y="284" fill="#1e1e2e" font-size="10" text-anchor="middle">+5</text>

  <circle cx="290" cy="280" r="16" fill="#f9e2af" stroke="#b4befe" stroke-width="1.5"/>
  <text x="290" y="284" fill="#1e1e2e" font-size="10" text-anchor="middle">+2</text>

  <circle cx="510" cy="280" r="16" fill="#585b70" stroke="#45475a" stroke-width="1.5"/>
  <line x1="503" y1="273" x2="517" y2="287" stroke="#f38ba8" stroke-width="2"/>
  <line x1="517" y1="273" x2="503" y2="287" stroke="#f38ba8" stroke-width="2"/>

  <circle cx="600" cy="280" r="16" fill="#585b70" stroke="#45475a" stroke-width="1.5"/>
  <line x1="593" y1="273" x2="607" y2="287" stroke="#f38ba8" stroke-width="2"/>
  <line x1="607" y1="273" x2="593" y2="287" stroke="#f38ba8" stroke-width="2"/>

  <rect x="30" y="330" width="660" height="140" fill="#313244" rx="6"/>

  <text x="50" y="355" fill="#f38ba8" font-size="14" font-weight="bold">X Pruned branches</text>
  <text x="50" y="375" fill="#cdd6f4" font-size="12">When a move is too good (score >= beta), remaining moves are skipped.</text>
  <text x="50" y="395" fill="#cdd6f4" font-size="12">This reduces search complexity from O(b^d) to O(b^(d/2)).</text>

  <text x="50" y="425" fill="#a6e3a1" font-size="12">o Evaluated leaf nodes</text>
  <text x="50" y="445" fill="#89dceb" font-size="12">o Internal nodes with best score propagated upward</text>

  <text x="50" y="465" fill="#585b70" font-size="11">Without pruning: 6 leaf evaluations | With pruning: 3 leaf evaluations (50% savings)</text>
</svg>